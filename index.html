<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fall 2026 Section Tracker</title>
<link rel="stylesheet" href="style.css?v=20260905081443">
<style>
#gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#f8f9fa;z-index:1000;font-family:-apple-system,Segoe UI,Roboto,sans-serif}
#gate .card{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:32px;box-shadow:0 4px 12px rgba(0,0,0,.08);width:340px;text-align:center}
#gate h2{font-size:18px;margin-bottom:6px} #gate p{color:#64748b;font-size:13px;margin-bottom:18px}
#gate input{width:100%;padding:10px;border:1px solid #e2e8f0;border-radius:6px;font-size:14px;margin-bottom:10px}
#gate button{width:100%;padding:10px;background:#3b82f6;color:#fff;border:none;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer}
#gate label{display:flex;gap:6px;align-items:center;font-size:12px;color:#64748b;margin:6px 0 12px;justify-content:center}
#gate .err{color:#ef4444;font-size:13px;min-height:18px}
</style>
<style>/* ============================================================================
   Left navigation rail — shared shell (opt-in; body.shell-rail)
   Extracted from the program tracker's inline rail (2026-08). Consumed two ways:
     • program/section tracker: <link>-loaded from shared/web/rail.css
     • retention tracker: inlined at build time by generate_dashboard.py
   Colors/tones are CSS custom properties so each tracker can brand the shell
   via :root overrides (e.g. --rail-logo-bg). See left-rail-redesign.md.
   ========================================================================== */
:root {
  --rail-w: 212px;                 /* live width; JS overrides + persists      */
  --rail-bg: #e7eaef;              /* grey navigation surface                  */
  --rail-border: #b4bdc9;          /* rail edge + footer/filters divider       */
  --rail-sep: #aab4c2;             /* group-label separators (matches GR)      */
  --rail-item: #3f4652;            /* nav/label text                          */
  --rail-heading: #0f172a;         /* group labels                            */
  --rail-hover: #dde1e8;
  --rail-active-bg: #dbe7f6;       /* active nav item (light navy/blue)        */
  --rail-active-fg: #1c4e8a;
  --rail-view-active-bg: #dfe9fb;
  --rail-logo-bg: #C8102E;         /* brand logo (NU red by default)           */
  --rail-accent: #2563eb;          /* single primary-action blue               */
  --rail-card-bg: #fff;            /* white filter cards on the grey rail      */
  --rail-card-border: #dfe3ea;
  --rail-muted: #6b7280;
}

/* Hidden by default; a fixed grey rail when the flag is on, page shifted right. */
#app-rail { display: none; }
body.shell-rail { padding-left: var(--rail-w, 212px); }
body.shell-rail #app-rail {
  display: flex; flex-direction: column;
  position: fixed; left: 0; top: 0; bottom: 0; width: var(--rail-w, 212px); z-index: 60;
  background: var(--rail-bg); border-right: 1px solid var(--rail-border); padding: 10px 0;
}
.rail-resize { position: absolute; top: 0; right: 0; width: 5px; height: 100%; cursor: col-resize; z-index: 61; }
.rail-resize:hover { background: var(--rail-sep); }

.rail-brand { display: flex; align-items: center; gap: 8px; padding: 2px 14px 10px; font-weight: 600; color: var(--rail-heading); font-size: 13px; }
.rail-logo { width: 22px; height: 22px; border-radius: 5px; background: var(--rail-logo-bg); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 13px; }

.rail-scroll { flex: 1; overflow-y: auto; padding: 0 8px; }
.rail-group-label { font-size: 12.5px; font-weight: 700; letter-spacing: .09em; color: var(--rail-heading); padding: 13px 8px 6px; margin-top: 7px; border-top: 1px solid var(--rail-sep); text-transform: uppercase; }
.rail-scroll > .rail-group-label:first-child { border-top: none; margin-top: 0; }
/* Collapsible section headers (Views / Filters) — closed by default. */
.rail-sec-toggle { cursor: pointer; display: flex; align-items: center; gap: 5px; user-select: none; }
.rail-sec-toggle:hover { color: var(--rail-active-fg); }
.rail-sec-caret { font-size: 10px; color: #9aa1ad; }
.rail-sec-count { font-size: 11px; color: var(--rail-accent); font-weight: 600; text-transform: none; letter-spacing: 0; }
.rail-item { display: block; width: 100%; text-align: left; border: none; background: none; padding: 6px 10px; border-radius: 7px; color: var(--rail-item); font-size: 13px; cursor: pointer; }
.rail-item:hover { background: var(--rail-hover); }
.rail-item.active { background: var(--rail-active-bg); color: var(--rail-active-fg); font-weight: 500; }
.rail-subitems { margin: 2px 0 0 12px; display: flex; flex-direction: column; gap: 1px; }
.rail-subitem { display: block; width: 100%; text-align: left; border: none; background: none; padding: 5px 10px; border-radius: 6px; color: var(--rail-item); font-size: 12px; cursor: pointer; }
.rail-subitem:hover { background: var(--rail-hover); }
.rail-subitem.active { background: #e6eefb; color: var(--rail-active-fg); font-weight: 500; }

/* Modes: a segmented toggle (e.g. Perspective) — a mode, not a filter. */
.rail-modes { display: flex; gap: 4px; padding: 2px 10px 2px; }
.rail-mode-btn { flex: 1; border: 1px solid var(--rail-card-border); background: var(--rail-card-bg); color: var(--rail-item); padding: 5px 8px; border-radius: 7px; font-size: 12.5px; cursor: pointer; }
.rail-mode-btn:hover { background: var(--rail-hover); }
.rail-mode-btn.active { background: var(--rail-active-bg); border-color: var(--rail-active-fg); color: var(--rail-active-fg); font-weight: 600; }
.rail-mode-sub-wrap:not(:empty) { padding: 5px 10px 2px; }
.rail-mode-sub { width: 100%; padding: 5px 7px; font-size: 12.5px; border: 1px solid var(--rail-card-border); border-radius: 7px; background: var(--rail-card-bg); color: var(--rail-item); cursor: pointer; }

/* Scopes: permanent top-level pickers under the "Focus" heading (College /
   Campus / Credential dropdowns + the Level buttons). */
.rail-scopes { padding: 4px 10px 4px; display: flex; flex-direction: column; gap: 7px; }
.rail-scope { display: flex; flex-direction: column; gap: 3px; }
.rail-scope .rail-modes { padding: 0; }
.rail-scope-label { font-size: 11px; font-weight: 700; letter-spacing: .04em; color: var(--rail-muted); text-transform: uppercase; }
.rail-scope-sel { width: 100%; padding: 6px 7px; font-size: 12.5px; border: 1px solid var(--rail-card-border); border-radius: 7px; background: var(--rail-card-bg); color: var(--rail-item); cursor: pointer; }
.rail-scope-sel:hover { border-color: var(--rail-active-fg); }
.rail-scope-action { display: block; width: 100%; text-align: left; border: none; background: none; padding: 6px 2px 2px; color: var(--rail-accent); font-size: 13px; cursor: pointer; }
.rail-scope-action:hover { text-decoration: underline; }

.rail-footer { padding: 10px 14px 2px; border-top: 1px solid var(--rail-border); }
.rail-fresh { font-size: 10.5px; color: var(--rail-muted); line-height: 1.5; }
.rail-fresh .rail-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; vertical-align: middle; background: #cbd5e1; }
.rail-fresh .rail-dot.green { background: #16a34a; } .rail-fresh .rail-dot.amber { background: #f59e0b; } .rail-fresh .rail-dot.red { background: #dc2626; }
.rail-shell-toggle { margin-top: 8px; background: none; border: 1px solid #cfd5dd; border-radius: 6px; padding: 4px 8px; font-size: 11px; color: var(--rail-item); cursor: pointer; }
.rail-shell-toggle:hover { background: var(--rail-hover); }

/* Views list */
.rail-views { display: flex; flex-direction: column; gap: 1px; }
.rail-view { display: block; width: 100%; text-align: left; border: none; background: none; padding: 5px 10px; border-radius: 7px; color: var(--rail-item); font-size: 12.5px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rail-view:hover { background: var(--rail-hover); }
.rail-view.active { background: var(--rail-view-active-bg); color: var(--rail-active-fg); }
.rail-view-manage { color: var(--rail-accent); margin-top: 2px; }

/* Rail Filters (active-filters + Add-filter model) */
.rail-filters-head { display: flex; align-items: center; padding: 11px 8px 5px; margin-top: 6px; border-top: 1px solid var(--rail-border); }
.rail-filters-head .rail-group-label { border-top: none; margin-top: 0; padding: 0; }
.rail-clear-filters { margin-left: auto; background: none; border: none; color: var(--rail-accent); font-size: 10px; cursor: pointer; }
.rail-filters { display: flex; flex-direction: column; gap: 2px; }
.rail-f-group { background: var(--rail-card-bg); border: 0.5px solid var(--rail-card-border); border-radius: 8px; overflow: hidden; }
.rail-f-head { display: flex; align-items: center; gap: 6px; padding: 7px 9px; cursor: pointer; font-size: 12.5px; color: #1f2937; }
.rail-f-head:hover { background: #f3f5f8; }
.rail-f-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--rail-accent); flex: none; }
.rail-f-label { flex: none; }
.rail-f-summary { margin-left: auto; font-size: 11px; color: var(--rail-active-fg); max-width: 96px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rail-f-x { color: #9aa1ad; font-size: 14px; line-height: 1; padding: 0 2px; }
.rail-f-x:hover { color: #a3312f; }
.rail-f-caret { color: #9aa1ad; font-size: 11px; }
.rail-f-body { padding: 4px 10px 8px; border-top: 0.5px solid #eef0f3; max-height: 210px; overflow-y: auto; }
.rail-f-opt { display: block; font-size: 12px; color: var(--rail-item); padding: 2px 0; cursor: pointer; white-space: nowrap; }
.rail-f-range { display: flex; gap: 6px; align-items: center; }
.rail-f-range input { width: 68px; font-size: 12px; padding: 3px 5px; border: 0.5px solid var(--rail-card-border); border-radius: 5px; }
.rail-f-text { width: 100%; font-size: 12px; padding: 4px 6px; border: 0.5px solid var(--rail-card-border); border-radius: 5px; box-sizing: border-box; }
.rail-addfilter-btn { margin-top: 4px; background: none; border: 0.5px dashed #b7c6e6; color: var(--rail-accent); border-radius: 8px; padding: 5px 10px; font-size: 12px; cursor: pointer; width: 100%; text-align: left; }
.rail-addfilter-btn:hover { background: #eef4ff; }
.rail-addfilter { margin-top: 4px; background: var(--rail-card-bg); border: 0.5px solid var(--rail-card-border); border-radius: 8px; padding: 6px; }
.rail-addfilter-search { width: 100%; font-size: 12px; padding: 5px 7px; border: 0.5px solid var(--rail-card-border); border-radius: 6px; box-sizing: border-box; }
.rail-addfilter-list { max-height: 220px; overflow-y: auto; margin-top: 5px; display: flex; flex-direction: column; gap: 1px; }
.rail-add-cat { font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #94a3b8; padding: 6px 8px 2px; }
.rail-add-item { display: block; width: 100%; text-align: left; border: none; background: none; padding: 5px 8px; border-radius: 6px; color: var(--rail-item); font-size: 12px; cursor: pointer; }
.rail-add-item:hover { background: #eef4ff; color: var(--rail-active-fg); }
.rail-add-empty { font-size: 11.5px; color: #9aa1ad; padding: 5px 8px; }
</style></head><body>
<div id="gate"><div class="card">
  <h2>Fall 2026 Section Tracker</h2>
  <p>Enter the access password.</p>
  <form id="gate-form">
    <input type="password" id="gate-pw" placeholder="Password" autofocus autocomplete="current-password">
    <label><input type="checkbox" id="gate-remember" checked> Remember me on this device</label>
    <button type="submit" id="gate-submit">Unlock</button>
    <div class="err" id="gate-err"></div>
  </form>
</div></div>
<div id="app-root" style="display:none">
  <header>
    <div class="header-left">
      <div class="header-name">
        <h1>Section Tracker</h1>
      </div>
      <div id="freshness-row" class="freshness-row">
        <span id="last-updated" class="last-updated"></span>
        <span id="app-build" class="last-updated"></span>
      </div>
    </div>
    <div class="header-search">
      <input type="text" id="f-search" placeholder="Search course, title, CRN, faculty…">
    </div>
    <div class="header-right">
      <!-- Tableau/Airtable connection indicators moved to the shared login
           console (console/app.py :5099). The source-staleness banner stays. -->
      
    </div>
  </header>

  <!-- Console modal (local-only, hidden on static site) -->
  <div id="console-modal" class="modal-overlay" style="display:none" onclick="closeConsoleModalIfBackdrop(event)">
    <div class="modal-panel" style="max-width:640px" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h2>Console</h2>
        <button class="modal-close" onclick="closeConsoleModal()">&times;</button>
      </div>
      <div class="modal-body" id="console-modal-body" style="font-size:13px">Loading…</div>
    </div>
  </div>

  <!-- Views modal (filter-tree builder, mirrors the program tracker) -->
  <div id="pv-modal-backdrop" class="pv-modal-backdrop" onclick="if(event.target===this)closeViewsModal()">
    <div class="pv-modal" role="dialog" aria-modal="true" aria-label="Views">
      <div class="pv-modal-header">
        <span class="pv-modal-title">Views</span>
        <span class="pv-modal-count" id="pv-modal-count"></span>
        <button class="pv-modal-x" onclick="closeViewsModal()" aria-label="Close">×</button>
      </div>
      <div class="pv-modal-body">
        <aside class="pv-modal-sidebar" id="pv-modal-sidebar"></aside>
        <div class="pv-modal-maincol">
          <div class="pv-modal-main" id="pv-modal-main"></div>
          <div class="pv-modal-footer" id="pv-modal-footer"></div>
        </div>
      </div>
    </div>
  </div>

  <main>
    <div id="source-banner"></div>

    <!-- Starred-view tiles (quick-apply) — shown above the filters -->
    <div id="view-tiles" class="portfolio-view-tiles" style="display:none"></div>

    <!-- Collapsible filter panel. Defaults closed; always collapsed on page load. -->
    <div id="filter-toggle-row">
      <button id="filter-toggle-btn" onclick="toggleFilters()">▸ Filters</button>
    </div>
    <div class="controls-section" id="controls-section">
      <div class="button-row" id="term-row"><!-- multi-select term buttons injected by JS --></div>
      <div class="button-row" id="resolved-row">
        <span class="row-label">Resolved</span>
        <button class="proposal-btn active-all" data-v="" onclick="setResolved('')">All</button>
        <button class="proposal-btn" data-v="no" onclick="setResolved('no')">Unresolved</button>
        <button class="proposal-btn" data-v="yes" onclick="setResolved('yes')">Resolved</button>
        <button class="proposal-btn" data-v="notes" onclick="setResolved('notes')">Has notes</button>
      </div>
      <div class="button-row" id="level-row">
        <span class="row-label">Level</span>
        <button class="proposal-btn active-all" data-v="" onclick="setLevel('')">All</button>
        <button class="proposal-btn" data-v="UG" onclick="setLevel('UG')">Undergraduate</button>
        <button class="proposal-btn" data-v="GR" onclick="setLevel('GR')">Graduate</button>
      </div>
      <div class="filters">
        <div class="filter-group"><label>College<sup class="filter-x" id="fx-college" onclick="clearOneFilter('college')" title="Clear" hidden>×</sup></label><div class="ms" id="ms-college"></div></div>
        <div class="filter-group"><label>Campus<sup class="filter-x" id="fx-campus" onclick="clearOneFilter('campus')" title="Clear" hidden>×</sup></label><div class="ms" id="ms-campus"></div></div>
        <div class="filter-group"><label>Modality<sup class="filter-x" id="fx-modality" onclick="clearOneFilter('modality')" title="Clear" hidden>×</sup></label><div class="ms" id="ms-modality"></div></div>
        <div class="filter-group"><label>Special Topics<sup class="info-i" id="f-special-info">i</sup><sup class="filter-x" id="fx-special" onclick="clearOneFilter('special')" title="Clear" hidden>×</sup></label><select id="f-special"><option value="">All</option><option value="Y">Special topics only</option><option value="N">Not special topics</option></select></div>
        <div class="filter-group"><label>Prior terms<sup class="filter-x" id="fx-prior" onclick="clearOneFilter('prior')" title="Clear" hidden>×</sup></label><select id="f-prior"><option value="">Any</option><option value="1">1+</option><option value="2">2+</option><option value="3">3+</option><option value="5">5+</option></select></div>
        <div class="filter-group"><label>Subject<sup class="filter-x" id="fx-subject" onclick="clearOneFilter('subject')" title="Clear" hidden>×</sup></label><div class="ms" id="ms-subject"></div></div>
        <button class="header-secondary-btn" onclick="clearFilters()">Clear</button>
      </div>
    </div>

    <div class="table-toolbar">
      <div class="summary" id="summary"></div>
      <div class="table-actions">
        <div class="portfolio-col-picker" id="section-col-picker" style="position:relative">
          <button class="portfolio-col-picker-btn" onclick="toggleSectionColPicker(event)">⊞ Columns ▾</button>
          <div class="portfolio-col-dropdown" id="section-col-dropdown"></div>
        </div>
        <button class="header-secondary-btn" onclick="exportSectionsCsv()" title="Export filtered rows to CSV">⤓ Export</button>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead><tr id="thead-row"></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>
<script>
(function(){
  const ENC_FILES = new Set(['data.json']);
  const REMEMBER_KEY='sectrk-key-v1', REMEMBER_TTL=30*864e5, CB="20260905081443";
  const dec=new TextDecoder(); let key=null; const cache=new Map();
  const gate=document.getElementById('gate'), form=document.getElementById('gate-form'),
        pw=document.getElementById('gate-pw'), err=document.getElementById('gate-err'),
        sub=document.getElementById('gate-submit'), rem=document.getElementById('gate-remember');
  const b64=s=>{const b=atob(s),o=new Uint8Array(b.length);for(let i=0;i<b.length;i++)o[i]=b.charCodeAt(i);return o;};
  async function derive(p,salt,it){const bk=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),{name:'PBKDF2'},false,['deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:it,hash:'SHA-256'},bk,{name:'AES-GCM',length:256},true,['decrypt']);}
  async function decrypt(k,blob){const iv=blob.slice(0,12),ct=blob.slice(12);return dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv},k,ct));}
  async function fetchDec(path){if(cache.has(path))return cache.get(path);
    const r=await fetch(path+'.enc?v='+CB,{cache:'no-store'});if(!r.ok)throw new Error('fetch');
    const obj=JSON.parse(await decrypt(key,new Uint8Array(await r.arrayBuffer())));cache.set(path,obj);return obj;}
  const of=window.fetch.bind(window);
  window.fetch=async function(u,o){const n=typeof u==='string'?u.replace(/^\.\//,'').split('?')[0]:null;
    if(n&&ENC_FILES.has(n)){const obj=await fetchDec(n);return new Response(JSON.stringify(obj),{status:200,headers:{'Content-Type':'application/json'}});}
    return of(u,o);};
  async function params(){return (await fetch('crypto.json?v='+CB)).json();}
  async function verify(k){const r=await fetch('data.json.enc?v='+CB);const obj=JSON.parse(await decrypt(k,new Uint8Array(await r.arrayBuffer())));cache.set('data.json',obj);return obj;}
  function boot(){gate.style.display='none';document.getElementById('app-root').style.display='';
    const s=document.createElement('script');s.src='app.js?v='+CB;document.head.appendChild(s);}
  async function unlock(p){const pr=await params();const k=await derive(p,b64(pr.salt),pr.iterations);await verify(k);key=k;
    if(rem.checked){try{const jwk=await crypto.subtle.exportKey('jwk',k);localStorage.setItem(REMEMBER_KEY,JSON.stringify({jwk,exp:Date.now()+REMEMBER_TTL}));}catch(e){}}boot();}
  form.addEventListener('submit',async e=>{e.preventDefault();err.textContent='';sub.disabled=true;sub.textContent='Unlocking…';
    try{await unlock(pw.value);}catch(x){err.textContent='Wrong password.';sub.disabled=false;sub.textContent='Unlock';pw.select();}});
  (async()=>{try{const raw=localStorage.getItem(REMEMBER_KEY);if(!raw)return;const {jwk,exp}=JSON.parse(raw);
    if(Date.now()>exp){localStorage.removeItem(REMEMBER_KEY);return;}const k=await crypto.subtle.importKey('jwk',jwk,{name:'AES-GCM'},true,['decrypt']);
    await verify(k);key=k;boot();}catch(e){localStorage.removeItem(REMEMBER_KEY);}})();
})();
</script>
</body></html>
